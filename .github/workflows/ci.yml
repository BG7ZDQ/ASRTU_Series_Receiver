name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  format:
    name: Format and workflow checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve comparison base
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: echo "sha=$(ci/resolve_base_revision.sh)" >> "$GITHUB_OUTPUT"
      - name: Install format tools
        run: sudo apt-get update && sudo apt-get install --yes clang-format
      - name: Validate workflow syntax
        run: |
          docker run --rm --volume "$PWD:/work:ro" --workdir /work \
            rhysd/actionlint:1.7.12 -color
      - name: Check changed C and C++ formatting
        run: |
          BASE_SHA=${{ steps.base.outputs.sha }}
          git diff --check "$BASE_SHA" HEAD
          ci/check_format.sh "$BASE_SHA"

  linux:
    name: Linux strict build and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve comparison base
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: echo "sha=$(ci/resolve_base_revision.sh)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-linux
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DASRTU_BUILD_BENCHMARK=OFF \
            -DASRTU_STRICT_WARNINGS=ON \
            -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run Cppcheck
        run: ci/run_cppcheck.sh build
      - name: Run Clang-Tidy on changed translation units
        run: |
          BASE_SHA=${{ steps.base.outputs.sha }}
          ci/run_clang_tidy.sh build "$BASE_SHA"

  sanitizers:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan and UBSan
            build_dir: build-asan-ubsan
            c_flags: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
            cxx_flags: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
            link_flags: -fsanitize=address,undefined
          - name: TSan
            build_dir: build-tsan
            c_flags: -O1 -g -fno-omit-frame-pointer -fsanitize=thread
            cxx_flags: -O1 -g -fno-omit-frame-pointer -fsanitize=thread
            link_flags: -fsanitize=thread
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - name: Configure
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DASRTU_BUILD_BENCHMARK=OFF \
            -DASRTU_STRICT_WARNINGS=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.link_flags }}"
      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" --parallel
      - name: Test ASan and UBSan
        if: matrix.name == 'ASan and UBSan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure
      - name: Test TSan
        if: matrix.name == 'TSan'
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/ci/tsan.supp:halt_on_error=1
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure

  windows:
    name: Windows strict build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: asrtu
          create-args: >-
            python=3.11 cmake ninja pkg-config gnuradio=3.10 qt-main=5 qwt
            boost-cpp fftw libsndfile zeromq m2w64-binutils -c conda-forge
          cache-environment: true
      - name: Build OOT dependencies and ASRTU
        shell: pwsh
        run: micromamba run -n asrtu powershell -NoProfile -ExecutionPolicy Bypass -File ci/build_windows.ps1
      - name: Smoke-test packaged Windows binaries
        shell: pwsh
        run: |
          $portable = "dist/windows/portable"
          $launcher = Join-Path $portable "ASRTU1_Launcher.exe"
          if (-not (Test-Path -LiteralPath $launcher)) {
            throw "Packaged launcher not found: $launcher"
          }
          # The launcher exits 0 after creating a session directory. A bounded
          # wait keeps an unexpected dialog from hanging the job forever.
          $process = Start-Process -FilePath $launcher `
            -ArgumentList '--check-session-directory' -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Launcher smoke test timed out after 30 seconds"
          }
          if ($process.ExitCode -ne 0) {
            throw "Launcher session check failed with exit code $($process.ExitCode)"
          }
          # The demodulator builds the GNU Radio flow graph at startup, which
          # proves the runtime DLLs load. The --screenshot timer may not fire
          # in the headless runner session, so a process that is still running
          # after the grace period counts as a successful launch and is killed.
          $shot = Join-Path $env:RUNNER_TEMP "asrtu-demod-smoke.png"
          $demod = Join-Path $portable "ASRTU1_Demod_CQt.exe"
          $process = Start-Process -FilePath $demod `
            -ArgumentList @('--screenshot', $shot) -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
          } elseif ($process.ExitCode -ne 0) {
            throw "Demod smoke test failed with exit code $($process.ExitCode)"
          }
          if (Test-Path -LiteralPath $shot) {
            Write-Host "Demod smoke screenshot: $shot"
          } else {
            Write-Host "Demod smoke screenshot not produced on this runner (process ran successfully)"
          }
          # The standalone SatNOGS uploader is required by the JAMX path. Its
          # preview mode validates the packaged Qt/ZMQ runtime and renders the
          # frame/configuration/server-feedback layout without sending data.
          $satnogsShot = Join-Path $env:RUNNER_TEMP "asrtu-satnogs-smoke.png"
          $satnogs = Join-Path $portable "ASRTU_SatnogsUploader.exe"
          $process = Start-Process -FilePath $satnogs -ArgumentList @(
            '--satellite', 'JAMX', '--norad-id', '98248',
            '--source', 'CI-TEST', '--longitude', '0', '--latitude', '0',
            '--altitude', '0', '--screenshot', $satnogsShot) -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "SatNOGS uploader smoke test timed out after 30 seconds"
          }
          if ($process.ExitCode -ne 0 -or
              -not (Test-Path -LiteralPath $satnogsShot)) {
            throw "SatNOGS uploader smoke test failed"
          }
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: asrtu-windows-x64
          path: dist/windows/*.zip
          if-no-files-found: error

  windows-installer:
    name: Windows Inno Setup installer
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download tested Windows package
        uses: actions/download-artifact@v4
        with:
          name: asrtu-windows-x64
          path: dist/windows
      - name: Prepare portable installer payload
        shell: pwsh
        run: |
          $archive = "dist/windows/asrtu-windows-x64.zip"
          $portable = Join-Path $env:RUNNER_TEMP "asrtu-portable"
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Windows portable archive not found: $archive"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $portable
          foreach ($required in @(
              'ASRTU1_Demod_CQt.exe',
              'ASRTU1_Launcher.exe',
              'ASRTU_SatnogsUploader.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $portable $required))) {
              throw "Portable installer input is incomplete: $required"
            }
          }
          "ASRTU_PORTABLE=$portable" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path -LiteralPath $iscc)) {
            # The hosted image can omit the compiler. The Chinese and Japanese
            # wizard messages are pinned in the repository, so a size-reduced
            # installation cannot break the multilingual installer.
            choco upgrade innosetup --yes --no-progress --force
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found after installation: $iscc"
          }
          "ASRTU_ISCC=$iscc" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and verify Inno Setup installer
        shell: pwsh
        run: |
          .\build_installer.ps1 `
            -DecoderSource $env:ASRTU_PORTABLE `
            -InnoSetup $env:ASRTU_ISCC
          $versionLine = Select-String -LiteralPath 'CMakeLists.txt' `
            -Pattern 'project\(ASRTU1Qt VERSION ([0-9.]+)' | Select-Object -First 1
          if (-not $versionLine) {
            throw 'Unable to read the application version from CMakeLists.txt'
          }
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          $installer = "packaging/inno/dist/ASRTU_Series_Receiver_Setup_${appVersion}.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Inno Setup installer was not created: $installer"
          }
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -lt 1MB) {
            throw "Inno Setup installer is unexpectedly small: $($item.Length) bytes"
          }
          Get-FileHash -LiteralPath $installer -Algorithm SHA256
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: asrtu-windows-installer
          path: packaging/inno/dist/ASRTU_Series_Receiver_Setup_*.exe
          if-no-files-found: error

  packages:
    name: Linux packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - name: Configure release build
        run: |
          cmake -S . -B build-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DASRTU_BUILD_BENCHMARK=OFF \
            -DASRTU_STRICT_WARNINGS=ON \
            -DBUILD_TESTING=ON
      - name: Build and test
        run: |
          cmake --build build-package --parallel
          ctest --test-dir build-package --output-on-failure
      - name: Create deb and rpm packages
        run: |
          cpack --config build-package/CPackConfig.cmake -G DEB -B dist/packages
          cpack --config build-package/CPackConfig.cmake -G RPM -B dist/packages
      - name: Download linuxdeploy
        run: |
          mkdir -p dist/tools
          curl --fail --location --retry 3 \
            --output dist/tools/linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output dist/tools/linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output dist/tools/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x dist/tools/linuxdeploy.AppImage dist/tools/linuxdeploy-plugin-qt.AppImage dist/tools/runtime-x86_64
      - name: Resolve application version
        id: version
        run: echo "app=$(sed -n 's/^project(ASRTU1Qt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LINUXDEPLOY: ${{ github.workspace }}/dist/tools/linuxdeploy.AppImage
          LINUXDEPLOY_PLUGIN_QT: ${{ github.workspace }}/dist/tools/linuxdeploy-plugin-qt.AppImage
          LDAI_RUNTIME_FILE: ${{ github.workspace }}/dist/tools/runtime-x86_64
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.app }}
        run: ci/build_appimage.sh build-package "$ASRTU_OOT_PREFIX" dist/appimage
      - name: Verify AppImage startup
        run: |
          appimage=$(find dist/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          appdir=dist/appimage/AppDir
          uploader_shot="$RUNNER_TEMP/asrtu-linux-satnogs.png"
          LD_LIBRARY_PATH="$appdir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            QT_PLUGIN_PATH="$appdir/usr/plugins" \
            timeout 30 xvfb-run --auto-servernum \
            "$appdir/usr/bin/ASRTU_SatnogsUploader" \
            --satellite JAMX --norad-id 98248 --source CI-TEST \
            --longitude 0 --latitude 0 --altitude 0 \
            --screenshot "$uploader_shot"
          test -s "$uploader_shot"
          XDG_CONFIG_HOME="$RUNNER_TEMP/asrtu-config" \
            XDG_DATA_HOME="$RUNNER_TEMP/asrtu-data" \
            timeout 30 xvfb-run --auto-servernum "$appimage" \
            --check-session-directory \
            > appimage-session-check.log 2>&1
          set +e
          XDG_CONFIG_HOME="$RUNNER_TEMP/asrtu-config" \
            XDG_DATA_HOME="$RUNNER_TEMP/asrtu-data" \
            timeout 10 xvfb-run --auto-servernum "$appimage" \
            > appimage-launch.log 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 124 ]]; then
            cat appimage-launch.log
            exit 1
          fi
          if grep -E 'cannot open shared object|Could not load the Qt platform plugin' \
            appimage-launch.log; then
            exit 1
          fi
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: asrtu-linux-packages
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Publish tag artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-installer, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: asrtu-linux-packages
          path: dist/linux
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: asrtu-windows-x64
          path: dist/windows
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: asrtu-windows-installer
          path: dist/windows-installer
      - name: Publish tag artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.zip
            dist/**/*.exe

  arch-package:
    name: Arch PKGBUILD syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate Arch package metadata
        run: |
          docker run --rm \
            --volume "$PWD:/src:ro" \
            --workdir /tmp \
            archlinux:base-devel \
            bash -lc 'useradd --create-home --user-group builder && install -d -o builder -g builder /build && cp /src/packaging/arch/PKGBUILD /build && chown builder:builder /build/PKGBUILD && su builder -s /bin/bash -c "cd /build && makepkg --printsrcinfo > .SRCINFO && test -s .SRCINFO"'
