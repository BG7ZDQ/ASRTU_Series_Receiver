name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  format:
    name: Format and workflow checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Resolve comparison base
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: echo "sha=$(ci/resolve_base_revision.sh)" >> "$GITHUB_OUTPUT"
      - name: Install format tools
        run: sudo apt-get update && sudo apt-get install --yes clang-format
      - name: Validate workflow syntax
        run: |
          docker run --rm --volume "$PWD:/work:ro" --workdir /work \
            rhysd/actionlint:1.7.12 -color
      - name: Test packaging helpers and Linux installer
        run: python3 -m unittest discover -s ci/tests -v
      - name: Check changed C and C++ formatting
        run: |
          BASE_SHA=${{ steps.base.outputs.sha }}
          # Vendored payloads are third-party release binaries/resources; their
          # upstream whitespace is not part of this project's style contract.
          git diff --check "$BASE_SHA" HEAD -- . \
            ':(exclude)packaging/payload/sdrpp/**' \
            ':(exclude)packaging/payload/sdrsharp/**' \
            ':(exclude)packaging/payload/plutosdr-driver/**'
          ci/check_format.sh "$BASE_SHA"

  posix-control:
    name: POSIX control protocol ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test shared-memory I/Q and concurrent Doppler updates
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/posix_bridge_test.cpp -o "$RUNNER_TEMP/posix_bridge_test"
          "$RUNNER_TEMP/posix_bridge_test"

  linux:
    name: Linux strict build and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Resolve comparison base
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: echo "sha=$(ci/resolve_base_revision.sh)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-linux
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DASRTU_BUILD_BENCHMARK=OFF \
            -DASRTU_STRICT_WARNINGS=ON \
            -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run Cppcheck
        run: ci/run_cppcheck.sh build
      - name: Run Clang-Tidy on changed translation units
        run: |
          BASE_SHA=${{ steps.base.outputs.sha }}
          ci/run_clang_tidy.sh build "$BASE_SHA"

  sanitizers:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan and UBSan
            build_dir: build-asan-ubsan
            c_flags: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
            cxx_flags: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
            link_flags: -fsanitize=address,undefined
          - name: TSan
            build_dir: build-tsan
            c_flags: -O1 -g -fno-omit-frame-pointer -fsanitize=thread
            cxx_flags: -O1 -g -fno-omit-frame-pointer -fsanitize=thread
            link_flags: -fsanitize=thread
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-linux
      - name: Configure
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DASRTU_BUILD_BENCHMARK=OFF \
            -DASRTU_STRICT_WARNINGS=ON \
            -DBUILD_TESTING=ON \
            -DTINY_DOPPLER_TEST_QPA_PLATFORM=minimal \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.link_flags }}"
      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" --parallel
      - name: Test ASan and UBSan
        if: matrix.name == 'ASan and UBSan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure
      - name: Test TSan
        if: matrix.name == 'TSan'
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/ci/tsan.supp:halt_on_error=1
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure

  windows:
    name: Windows strict build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: asrtu
          create-args: >-
            python=3.11 cmake ninja pkg-config gnuradio=3.10 qt-main=5 qwt=6.3.0=h9417a65_0
            boost-cpp fftw libsndfile zeromq m2w64-binutils -c conda-forge
          cache-environment: true
      - name: Build OOT dependencies and ASRTU
        shell: pwsh
        run: micromamba run -n asrtu powershell -NoProfile -ExecutionPolicy Bypass -File ci/build_windows.ps1
      - name: Smoke-test packaged Windows binaries
        shell: pwsh
        run: python ci/check_windows_startup.py dist/windows/portable --output "$env:RUNNER_TEMP/asrtu-startup"
      - name: Upload Windows startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-diagnostics
          path: ${{ runner.temp }}/asrtu-startup/
          if-no-files-found: ignore
      - name: Upload tested installer input
        uses: actions/upload-artifact@v4
        with:
          name: asrtu-windows-installer-input
          path: dist/windows/portable/
          if-no-files-found: error

  windows-installer:
    name: Windows Inno Setup installer
    needs: windows
    runs-on: windows-2022
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download tested Windows package
        uses: actions/download-artifact@v4
        with:
          name: asrtu-windows-installer-input
          path: dist/windows
      - name: Locate tested installer input
        shell: pwsh
        run: |
          $payload = (Resolve-Path 'dist/windows').Path
          foreach ($required in @('ASRTU1_Demod_CQt.exe', 'ASRTU1_Launcher.exe',
                                  'TinyDoppler.exe', 'ASRTU_SatnogsUploader.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $payload $required))) {
              throw "Installer input is incomplete: $required"
            }
          }
          "ASRTU_PORTABLE=$payload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path -LiteralPath $iscc)) {
            # The hosted image can omit the compiler. The Chinese and Japanese
            # wizard messages are pinned in the repository, so a size-reduced
            # installation cannot break the multilingual installer.
            choco upgrade innosetup --yes --no-progress --force
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found after installation: $iscc"
          }
          "ASRTU_ISCC=$iscc" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and verify Inno Setup installer
        id: package
        shell: pwsh
        run: |
          .\build_installer.ps1 `
            -DecoderSource $env:ASRTU_PORTABLE `
            -InnoSetup $env:ASRTU_ISCC
          $versionLine = Select-String -LiteralPath 'CMakeLists.txt' `
            -Pattern 'project\(ASRTU1Qt VERSION ([0-9.]+)' | Select-Object -First 1
          if (-not $versionLine) {
            throw 'Unable to read the application version from CMakeLists.txt'
          }
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          $artifactName = "ASRTU_Series_Receiver-${appVersion}-x86_64-WinInstaller"
          $installer = "packaging/inno/dist/${artifactName}.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Inno Setup installer was not created: $installer"
          }
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -lt 1MB) {
            throw "Inno Setup installer is unexpectedly small: $($item.Length) bytes"
          }
          Get-FileHash -LiteralPath $installer -Algorithm SHA256
          New-Item -ItemType Directory -Force -Path 'dist/windows-installer' | Out-Null
          Compress-Archive -LiteralPath $installer `
            -DestinationPath "dist/windows-installer/${artifactName}.zip" -Force
          "artifact-name=$artifactName" >> $env:GITHUB_OUTPUT
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: dist/windows-installer/*-WinInstaller.zip
          if-no-files-found: error

  packages:
    name: Linux AppImage
    # Build portable artifacts on the oldest supported Ubuntu baseline.
    # Binaries built on 24.04 may require a newer glibc than 22.04 provides.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-linux
      - name: Configure release build
        run: |
          cmake -S . -B build-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DASRTU_BUILD_BENCHMARK=OFF \
            -DASRTU_STRICT_WARNINGS=ON \
            -DBUILD_TESTING=ON
      - name: Build and test
        run: |
          cmake --build build-package --parallel
          ctest --test-dir build-package --output-on-failure
      - name: Download linuxdeploy
        run: |
          mkdir -p dist/tools
          curl --fail --location --retry 3 \
            --output dist/tools/linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output dist/tools/linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output dist/tools/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x dist/tools/linuxdeploy.AppImage dist/tools/linuxdeploy-plugin-qt.AppImage dist/tools/runtime-x86_64
      - name: Resolve application version
        id: version
        run: echo "app=$(sed -n 's/^project(ASRTU1Qt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LINUXDEPLOY: ${{ github.workspace }}/dist/tools/linuxdeploy.AppImage
          LINUXDEPLOY_PLUGIN_QT: ${{ github.workspace }}/dist/tools/linuxdeploy-plugin-qt.AppImage
          LDAI_RUNTIME_FILE: ${{ github.workspace }}/dist/tools/runtime-x86_64
          VERSION: ${{ steps.version.outputs.app }}
        run: ci/build_appimage.sh build-package "$ASRTU_OOT_PREFIX" dist/appimage
      - name: Enforce Ubuntu 22.04 glibc baseline
        run: |
          python3 ci/check_linux_abi.py dist/appimage/AppDir dist/appimage/*.AppImage
      - name: Verify AppImage startup
        run: |
          appimage=$(find dist/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          appdir=dist/appimage/AppDir
          uploader_shot="$RUNNER_TEMP/asrtu-linux-satnogs.png"
          LD_LIBRARY_PATH="$appdir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            QT_PLUGIN_PATH="$appdir/usr/plugins" \
            timeout 30 xvfb-run --auto-servernum \
            "$appdir/usr/bin/ASRTU_SatnogsUploader" \
            --satellite JAMX --norad-id 100470 --source CI-TEST \
            --longitude 0 --latitude 0 --altitude 0 \
            --screenshot "$uploader_shot"
          test -s "$uploader_shot"
          doppler_shot="$RUNNER_TEMP/asrtu-linux-doppler.png"
          XDG_CONFIG_HOME="$RUNNER_TEMP/asrtu-doppler-config" \
            XDG_DATA_HOME="$RUNNER_TEMP/asrtu-doppler-data" \
            LD_LIBRARY_PATH="$appdir/usr/lib" \
            QT_PLUGIN_PATH="$appdir/usr/plugins" \
            timeout 30 xvfb-run --auto-servernum \
            "$appdir/usr/bin/TinyDoppler" \
            --screenshot-catalog "$doppler_shot"
          test -s "$doppler_shot"
          XDG_CONFIG_HOME="$RUNNER_TEMP/asrtu-config" \
            XDG_DATA_HOME="$RUNNER_TEMP/asrtu-data" \
            timeout 30 xvfb-run --auto-servernum "$appimage" \
            --check-session-directory \
            > appimage-session-check.log 2>&1
          set +e
          XDG_CONFIG_HOME="$RUNNER_TEMP/asrtu-config" \
            XDG_DATA_HOME="$RUNNER_TEMP/asrtu-data" \
            timeout 10 xvfb-run --auto-servernum "$appimage" \
            > appimage-launch.log 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 124 ]]; then
            cat appimage-launch.log
            exit 1
          fi
          if grep -E 'cannot open shared object|Could not load the Qt platform plugin' \
            appimage-launch.log; then
            exit 1
          fi
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: asrtu-linux-appimage
          path: dist/appimage/*.AppImage
          if-no-files-found: error

  plugin-native:
    name: SDR++ ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, platform: Windows-x64}
          - {runner: ubuntu-24.04, platform: Linux-x86_64}
          - {runner: ubuntu-24.04-arm, platform: Linux-arm64}
          - {runner: macos-15-intel, platform: macOS-x86_64}
          - {runner: macos-14, platform: macOS-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: AlexandreRouma/SDRPlusPlus
          ref: 53230af19102e600148a18af9d21e8a92b8701d0
          path: work/sdrpp-source
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'Windows'
        with:
          environment-name: plugin
          create-args: python=3.11 cmake volk fftw -c conda-forge
          cache-environment: true
      - name: Install Linux headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libvolk-dev libfftw3-dev libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev libx11-dev
      - name: Install macOS headers
        if: runner.os == 'macOS'
        run: brew install cmake volk fftw pkg-config
      - name: Build Unix bridge
        if: runner.os != 'Windows'
        run: python3 ci/build_sdrpp_plugin.py --source work/sdrpp-source --build work/plugin-build --output "dist/plugin/SDR++/${{ matrix.platform }}"
      - name: Build Windows bridges
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          micromamba run -n plugin python ci/build_sdrpp_plugin.py --source work/sdrpp-source --build work/plugin-build --output 'dist/plugin/SDR++/Windows-x64' --dependency-prefix "$env:MAMBA_ROOT_PREFIX/envs/plugin/Library"
          if ($LASTEXITCODE) { throw 'SDR++ build failed' }
          ./external/TinyDoppler/plugin/build_legacy.ps1 -SdrSharpApiRoot ./packaging/payload/sdrsharp-api
          New-Item -ItemType Directory -Force 'dist/plugin/SDR#/Windows-x86' | Out-Null
          Copy-Item external/TinyDoppler/plugin/bin/Release/net46/SDRSharp.AstroSeriesBridge.dll 'dist/plugin/SDR#/Windows-x86/'
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}
          path: dist/plugin/
          if-no-files-found: error

  plugins:
    name: Assemble cross-platform plugins
    needs: plugin-native
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: work/plugins
      - name: Verify complete platform matrix and package
        id: package
        run: |
          cp integrations/sdrpp/README.md 'work/plugins/SDR++/README.md'
          cp external/TinyDoppler/plugin/README.md 'work/plugins/SDR#/README.md'
          archive=$(python3 ci/package_plugins.py work/plugins dist/plugins)
          echo "artifact-name=$(basename "$archive" .zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: dist/plugins/*.zip
          if-no-files-found: error

  linux-bundle:
    name: Linux installer bundle
    needs: [packages, plugins]
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: asrtu-linux-appimage
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plugins.outputs.artifact-name }}
          path: dist/plugins
      - name: Verify bundled SDR++ package
        run: |
          echo '9B646FE5D96E1BD7236C0B336B9057E09F478645BFC2C67862E91763545B325B  packaging/payload/sdrpp-linux/sdrpp_ubuntu_jammy_amd64.deb' | sha256sum -c -
      - name: Assemble Linux AppImage installer ZIP
        id: package
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip
          mkdir -p work/plugins
          unzip -q dist/plugins/SDR_Software_Plugins-*-AllPlatform.zip -d work/plugins
          version=$(sed -n 's/^project(ASRTU1Qt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          ci/package_linux_appimage.sh \
            dist/linux/*.AppImage \
            work/plugins/SDR++/Linux-x86_64/asrtu_sink.so \
            packaging/payload/sdrpp-linux/sdrpp_ubuntu_jammy_amd64.deb \
            dist/linux-bundle "$version"
          echo "artifact-name=ASRTU_Series_Receiver-${version}-x86_64-LinuxAppImage" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: dist/linux-bundle/*.zip
          if-no-files-found: error

  macos:
    name: macOS receiver ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, arch: x86_64}
          - {runner: macos-14, arch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: asrtu
          create-args: >-
            python=3.11 cmake ninja pkg-config gnuradio=3.10 qt-main=5 qwt=6.2
            boost-cpp fftw libsndfile zeromq -c conda-forge
          cache-environment: true
          init-shell: bash
      - name: Build and test
        run: |
          bash ci/install_linux_oot.sh "$PWD/work/oot-install" "$PWD/work/oot"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/work/oot-install;$CONDA_PREFIX" \
            -DASRTU_BUILD_BENCHMARK=OFF -DBUILD_TESTING=ON
          cmake --build build --parallel 3
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      - name: Assemble and verify app bundle
        id: package
        run: |
          python3 ci/build_macos_app.py --build-dir build --output dist/macos \
            --dep-prefix "$CONDA_PREFIX" --dep-prefix "$PWD/work/oot-install"
          env -u DYLD_LIBRARY_PATH -u QT_PLUGIN_PATH \
            'dist/macos/ASRTU Series Receiver.app/Contents/MacOS/ASRTU1_Launcher' --check-session-directory
          version=$(sed -n 's/^project(ASRTU1Qt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          artifact_name="ASRTU_Series_Receiver-${version}-${{ matrix.arch }}-macOS"
          ditto -c -k --sequesterRsrc --keepParent 'dist/macos/ASRTU Series Receiver.app' \
            "dist/macos/${artifact_name}.zip"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: dist/macos/*.zip
          if-no-files-found: error

  release:
    name: Publish tag artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-installer, packages, plugins, linux-bundle, macos, posix-control]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS apps
        uses: actions/download-artifact@v4
        with:
          pattern: ASRTU_Series_Receiver-*-*-macOS
          merge-multiple: true
          path: dist/macos
      - name: Download Linux installer bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux-bundle.outputs.artifact-name }}
          path: dist/linux-bundle
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-installer.outputs.artifact-name }}
          path: dist/windows-installer
      - name: Download standalone plugins
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plugins.outputs.artifact-name }}
          path: dist/plugins
      - name: Publish tag artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ contains(github.ref_name, 'nightly') && format('ASRTU Series Receiver {0} (nightly)', github.ref_name) || github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'nightly') }}
          files: |
            dist/plugins/SDR_Software_Plugins-*-AllPlatform.zip
            dist/linux-bundle/ASRTU_Series_Receiver-*-*-LinuxAppImage.zip
            dist/windows-installer/ASRTU_Series_Receiver-*-*-WinInstaller.zip
            dist/macos/ASRTU_Series_Receiver-*-*-macOS.zip

  arch-package:
    name: Arch PKGBUILD syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generate Arch package metadata
        run: |
          docker run --rm \
            --volume "$PWD:/src:ro" \
            --workdir /tmp \
            archlinux:base-devel \
            bash -lc 'useradd --create-home --user-group builder && install -d -o builder -g builder /build && cp /src/packaging/arch/PKGBUILD /build && chown builder:builder /build/PKGBUILD && su builder -s /bin/bash -c "cd /build && makepkg --printsrcinfo > .SRCINFO && test -s .SRCINFO"'
